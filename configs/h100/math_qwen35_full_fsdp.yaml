# Full-parameter SFT of Qwen3.5-4B (verifier: Qwen3.5-9B). Does NOT fit one GPU: fp32 master
# weights + grads + AdamW for ~4.2B params is ~67 GB, plus ~10 GB of 248k-vocab logits/loss.
# Train with FSDP on >= 2x H100-80GB:
#   slurm/submit.sh train --gpus h100:2 --accelerate-config configs/accelerate/fsdp_h100.yaml \
#       --min-gpu-mem-gb 79 ...
# Boosting (one GPU, both models) also needs an 80 GB H100.
model:
  name_or_path: Qwen/Qwen3.5-4B
  dtype: bfloat16
  max_model_len: 8192      # prompt = question + expert + growing prefix (+1856 new)
backend:
  kind: vllm
  gpu_memory_utilization: 0.50
boost:
  num_candidates: 8
  max_rounds: 6
  max_new_tokens: 1856
  examples_per_batch: 256
verifier:
  model: Qwen/Qwen3.5-9B
  gpu_memory_utilization: 0.35
train:
  learning_rate: 1.0e-5
  num_epochs: 2
  per_device_batch_size: 1
  grad_accum_steps: 16      # effective batch 32 with 2 GPUs
  max_seq_len: 2048
  param_dtype: float32
  mixed_precision: bf16
  gradient_checkpointing: true
  save_every_steps: 200
eval:
  max_new_tokens: 2048
  batch_size: 256
