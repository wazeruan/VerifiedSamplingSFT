# MATH L3-5 with Qwen3.5: student Qwen3.5-4B, verifier Qwen3.5-9B, LoRA SFT.
# REQUIRES an 80 GB H100 (submit with --min-gpu-mem-gb 79): boosting serves both models
# from one GPU (student 50% = 40 GB, verifier 35% = 28 GB; the 9B weights alone are ~19 GB),
# and LoRA training's logits/loss over the 248k vocabulary need the headroom.
# Set `verifier.model: ""` only if you want the student to grade its own candidates.
# Paper hyperparameters: T=1856 max length, N_MCMC=10; SFT lr {5e-5,1e-5,5e-6},
# epochs {1,2}, batch {16,32,64}, AdamW + cosine, grad clip 1.0.
model:
  name_or_path: Qwen/Qwen3.5-4B
  dtype: bfloat16           # H100 supports bf16
  max_model_len: 8192      # prompt = question + expert + growing prefix (+1856 new)
backend:
  kind: vllm
  gpu_memory_utilization: 0.50   # student engine; the verifier engine gets verifier.* share
boost:
  num_candidates: 8
  max_rounds: 6
  temperature: 1.0
  max_new_tokens: 1856
  tie_epsilon: 0.02
  on_failure: expert
  proposal_prompt: generic
  examples_per_batch: 256   # examples advanced together per round (vLLM batches them)
verifier:
  model: Qwen/Qwen3.5-9B
  gpu_memory_utilization: 0.35
  max_new_tokens: 256
  use_answer_check: true
train:
  learning_rate: 1.0e-4     # LoRA lr; use 1e-5 for full finetuning
  num_epochs: 2
  per_device_batch_size: 2   # 248k-vocab logits + fp32 loss dominate memory: keep small
  grad_accum_steps: 16      # effective batch 32 per GPU
  max_seq_len: 2048
  param_dtype: auto         # bf16 frozen base for LoRA
  mixed_precision: bf16
  gradient_checkpointing: true
  lora_r: 64
  lora_alpha: 128
  save_every_steps: 200     # resumable mid-epoch checkpoints
eval:
  max_new_tokens: 2048
  batch_size: 256
